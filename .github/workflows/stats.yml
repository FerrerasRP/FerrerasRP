name: GitHub Readme Stats Action

on:
  schedule:
    - cron: "0 0 * * *" # Executa todo dia à meia-noite
  workflow_dispatch:     # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gera o card de linguagens mais usadas
      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=FerrerasRP&layout=compact&theme=default&
          path: top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Most used (with details)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.languages.details.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: FerrerasRP
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: ""
          plugin_languages_limit: 10
          config_timezone: America/Sao_Paulo
          
      # Gera o card das metricas do perfil
      - name: Generate Metric Card
        uses: lowlighter/metrics@latest
        with:
            filename: metrics.svg
            token: ${{ secrets.GITHUB_TOKEN }}
            user: FerrerasRP
            template: classic
            base: header, activity, community, repositories, metadata
            plugins_languages: yes
            plugins_languages_details: bytes-size, percentage
            plugins_languages_ignored: ""
            config_timezone: America/Sao_Paulo
    
      - name: Commit and push generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update generated github stats cards"
          file_pattern: "*.svg"
